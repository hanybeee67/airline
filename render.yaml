# Render Blueprint — deploys the game as a static site.
# In the Render dashboard: New + → Blueprint, point it at this repo, and it
# reads the settings below automatically.
services:
  - type: web
    name: sky-airline-tycoon
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Single-page app: serve index.html for any path.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
