name: Build Windows installer

# Builds the offline Windows installer (.exe) in the cloud so you can download
# it without installing Node or any build tools locally.
#
# Run it: GitHub → Actions tab → "Build Windows installer" → Run workflow.
# When it finishes, open the run and download the "sky-airline-tycoon-windows"
# artifact — it contains the Setup .exe. Pushing a tag like v1.0.0 also builds
# it and attaches the installer to a GitHub Release.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: sky-airline-tycoon-windows
          path: release/*.exe
          if-no-files-found: error

      - name: Attach installer to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
