<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b3a6b"/>
      <stop offset="0.55" stop-color="#12245c"/>
      <stop offset="1" stop-color="#0a1330"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#4f9bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4f9bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe0ff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#glow)"/>

  <!-- Globe -->
  <g stroke="#5b7fc7" stroke-opacity="0.55" fill="none" stroke-width="6">
    <circle cx="512" cy="512" r="300"/>
    <ellipse cx="512" cy="512" rx="300" ry="120"/>
    <ellipse cx="512" cy="512" rx="140" ry="300"/>
    <line x1="212" y1="512" x2="812" y2="512"/>
  </g>

  <!-- Orbit route arc -->
  <path d="M232 640 Q512 300 800 470" fill="none" stroke="#4f9bff" stroke-width="14"
        stroke-linecap="round" stroke-dasharray="4 34"/>

  <!-- Airplane -->
  <g transform="translate(512 512) rotate(35)">
    <path d="M0 -250 C 34 -250 52 -196 52 -150 L 52 -70 L 220 40 L 220 96 L 52 44
             L 52 150 L 108 196 L 108 236 L 0 210 L -108 236 L -108 196 L -52 150
             L -52 44 L -220 96 L -220 40 L -52 -70 L -52 -150 C -52 -196 -34 -250 0 -250 Z"
          fill="url(#plane)"/>
  </g>
</svg>
